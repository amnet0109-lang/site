<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KNights のアプリ / KNights Apps</title>
<style>
  :root { --fg: #2a2118; --bg: #f9f4e8; --muted: #675e55; --accent: #8a5a2b; --line: #ddd3bd; --btn: #2a2118; --btnfg: #f9f4e8; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f1ece4; --bg: #1c1712; --muted: #bdb2a5; --accent: #e0b27a; --line: #43382c; --btn: #f1ece4; --btnfg: #1c1712; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.75 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.5rem; line-height: 1.35; color: var(--accent); margin: 0 0 .2em; }
  p { margin: .6em 0; }
  .meta { color: var(--muted); font-size: .9rem; }
  a { color: var(--accent); }
  .btn { display: block; margin: 14px 0; padding: 14px 16px; border-radius: 12px; background: var(--btn); color: var(--btnfg); text-align: center; text-decoration: none; font-weight: 600; }
  .btn.off { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
  ul.apps { list-style: none; padding: 0; margin: 1.2em 0; border-top: 1px solid var(--line); }
  ul.apps li { border-bottom: 1px solid var(--line); }
  ul.apps a { display: block; padding: 12px 4px; text-decoration: none; color: var(--fg); }
  ul.apps small { display: block; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">KNights のアプリ</h1>
  <p class="meta" id="tagline"></p>
  <p id="msg"></p>
  <div id="buttons"></div>
  <ul class="apps" id="list" hidden></ul>
  <p class="meta" id="foot">提供者：KNights</p>
  <noscript><p>このページは JavaScript を使います。お使いのストアで「KNights」を検索してください。</p></noscript>
</main>
<script>
(function () {
  // key: [日本語名, English name, ひとこと(ja), tagline(en), Android パッケージ, App Store の ID（未公開は ""）]
  var APPS = {
    futarishogi:     ["ふたりで将棋", "Shogi for Two", "スマホ2台で対戦・ネット不要", "Two phones, no internet", "com.knights.futarishogi", ""],
    futarichess:     ["ふたりでチェス", "Chess for Two", "スマホ2台で対戦・ネット不要", "Two phones, no internet", "com.knights.futarichess", "6829052140"],
    futarireversi:   ["ふたりでリバーシ", "Reversi for Two", "スマホ2台で対戦・ネット不要", "Two phones, no internet", "com.knights.futarireversi", "6828420530"],
    futarigomoku:    ["ふたりで五目並べ", "Gomoku for Two", "スマホ2台で対戦・ネット不要", "Two phones, no internet", "com.knights.futarigomoku", "6826697799"],
    futariyonmoku:   ["重力つき4目並べ", "Four in a Row for Two", "スマホ2台で対戦・ネット不要", "Two phones, no internet", "com.knights.futariyonmoku", "6829038832"],
    futarimancala:   ["ふたりでマンカラ", "Mancala for Two", "スマホ2台で対戦・ネット不要", "Two phones, no internet", "com.knights.futarimancala", ""],
    futariminigames: ["ふたりでミニゲーム", "Mini Games for Two", "スマホ2台で9種対戦", "Nine games on two phones", "com.knights.futariminigames", ""],
    minnadaifugo:    ["みんなで大富豪", "Daifugo Together", "ネット不要のトランプ大富豪", "Card game, no internet", "com.knights.minnadaifugo", ""],
    minnatrump:      ["みんなでトランプ", "Cards Together", "ネット不要のトランプ", "Card games, no internet", "com.knights.minnatrump", ""],
    minnapageone:    ["みんなでページワン", "Page One Together", "ネット不要のトランプ対戦", "Card game, no internet", "com.knights.minnapageone", ""],
    minnabingo:      ["みんなでビンゴ", "Bingo Together", "ネット不要のビンゴ大会", "Bingo party, no internet", "com.knights.minnabingo", "6829170692"],
    hayaoshi:        ["みんなで早押し", "Quiz Buzzer Together", "ネット不要のクイズ早押しボタン", "Quiz buzzer, no internet", "com.knights.hayaoshi", ""],
    sobachat:        ["ソバチャ", "SobaChat", "近くの人とネットなしでチャット", "Offline chat with people nearby", "com.knights.sobachat", "6831871184"],
    beaconscope:     ["ビーコンスコープ", "BeaconScope", "BLEスキャナ", "BLE scanner", "com.knights.beaconscope", ""],
    tagmihari:       ["タグみはり", "Tag Mihari", "紛失防止タグ・追跡タグ検出", "Tracker tag detector", "com.knights.tagmihari", ""],
    inunote:         ["いぬノート", "Inu Note", "犬の体重・体調・散歩の記録", "Dog health diary", "com.knights.inunote", ""],
    nekonote:        ["ねこノート", "Neko Note", "猫の体重・体調・通院の記録", "Cat health diary", "com.knights.nekonote", ""]
  };

  var q = new URLSearchParams(location.search);
  var key = (q.get("a") || "").toLowerCase();
  var src = (q.get("s") || "qr").replace(/[^a-z0-9_-]/gi, "").slice(0, 24) || "qr";
  var ja = /^ja/i.test(navigator.language || "ja");
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  function playUrl(pkg) {
    return "https://play.google.com/store/apps/details?id=" + pkg +
      "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=referral");
  }
  function iosUrl(id) { return "https://apps.apple.com/app/id" + id; }
  function $(id) { return document.getElementById(id); }
  function button(text, href) {
    var a = document.createElement(href ? "a" : "span");
    a.className = href ? "btn" : "btn off";
    a.textContent = text;
    if (href) a.href = href;
    $("buttons").appendChild(a);
  }

  document.documentElement.lang = ja ? "ja" : "en";
  $("foot").textContent = ja ? "提供者：KNights" : "By KNights";

  var app = APPS[key];
  if (!app) {
    // アプリの指定がない／知らない名前のとき：一覧を出す
    $("title").textContent = ja ? "KNights のアプリ" : "KNights Apps";
    $("msg").textContent = ja ? "アプリを選んでください。" : "Choose an app.";
    var list = $("list");
    Object.keys(APPS).forEach(function (k) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "?a=" + k + "&s=" + src;
      a.textContent = ja ? APPS[k][0] : APPS[k][1];
      var s = document.createElement("small");
      s.textContent = ja ? APPS[k][2] : APPS[k][3];
      a.appendChild(s);
      li.appendChild(a);
      list.appendChild(li);
    });
    list.hidden = false;
    return;
  }

  var name = ja ? app[0] : app[1];
  var pkg = app[4], iosId = app[5];
  document.title = name;
  $("title").textContent = name;
  $("tagline").textContent = ja ? app[2] : app[3];

  if (isAndroid) {
    $("msg").textContent = ja ? "ストアを開いています…" : "Opening the store…";
    button(ja ? "Google Play で開く" : "Open in Google Play", playUrl(pkg));
    location.replace(playUrl(pkg));
  } else if (isIOS) {
    if (iosId) {
      $("msg").textContent = ja ? "ストアを開いています…" : "Opening the store…";
      button(ja ? "App Store で開く" : "Open in the App Store", iosUrl(iosId));
      location.replace(iosUrl(iosId));
    } else {
      $("msg").textContent = ja
        ? "iPhone 版は準備中です。公開までしばらくお待ちください。"
        : "The iPhone version is coming soon.";
      button(ja ? "iPhone 版：準備中" : "iPhone version: coming soon", "");
    }
  } else {
    $("msg").textContent = ja
      ? "スマートフォンでこのページを開くと、ストアへ移動します。"
      : "Open this page on your phone to go to the store.";
    if (iosId) button(ja ? "iPhone：App Store で開く" : "iPhone: App Store", iosUrl(iosId));
    else button(ja ? "iPhone 版：準備中" : "iPhone version: coming soon", "");
    button(ja ? "Android：Google Play で開く" : "Android: Google Play", playUrl(pkg));
  }
})();
</script>
</body>
</html>
